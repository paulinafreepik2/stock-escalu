<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK IMMINENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Reglas de seguridad: OCULTAR según el modo */
        .modo-cliente .solo-admin { display: none !important; }
        .modo-cliente .col-pedido { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans text-sm">
    <div class="max-w-6xl mx-auto p-2 md:p-4">
        
        <div id="pantalla-login" class="mt-20 max-w-md mx-auto bg-slate-800 p-8 rounded-3xl text-center border border-slate-700 shadow-2xl">
            <h1 class="text-4xl font-black mb-6 italic tracking-tighter">IMMINENT</h1>
            <input id="input-pass" type="password" placeholder="Clave" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-600 mb-4 text-center text-white text-xl">
            <button onclick="verificar()" class="w-full bg-blue-600 p-4 rounded-xl font-bold text-xl uppercase shadow-lg active:scale-95 transition">Entrar</button>
        </div>

        <div id="menu-secciones" class="hidden text-center">
            <header class="mb-10 text-center">
                <h1 class="text-6xl font-black italic text-white tracking-tighter">IMMINENT</h1>
                <p id="txt-bienvenida" class="text-slate-400 font-bold mt-2 uppercase bg-slate-800 inline-block px-4 py-1 rounded-full text-xs"></p>
            </header>
            
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-10">
                <button onclick="cargarStock('DAKOTA')" class="bg-orange-800 p-6 rounded-2xl font-bold shadow-lg text-lg">🌲 DAKOTA</button>
                <button onclick="cargarStock('DIURNO')" class="bg-sky-600 p-6 rounded-2xl font-bold shadow-lg text-lg">🌅 DIURNO</button>
                <button onclick="cargarStock('NOCTURNO')" class="bg-indigo-900 p-6 rounded-2xl font-bold shadow-lg text-lg">🌙 NOCTURNO</button>
                <button onclick="cargarStock('SOFAS')" class="bg-red-700 p-6 rounded-2xl font-bold shadow-lg text-lg">🛋️ SOFÁS</button>
                <button onclick="cargarStock('ELIAS')" class="bg-purple-700 p-6 rounded-2xl font-bold shadow-lg text-lg">📦 ELIAS</button>
                <button onclick="verPedidos()" class="solo-admin bg-emerald-600 p-6 rounded-2xl font-bold shadow-lg text-lg border-2 border-emerald-400">📝 PEDIDOS</button>
            </div>

            <div class="solo-admin p-6 bg-slate-800 rounded-3xl border border-slate-700 max-w-sm mx-auto shadow-xl">
                <p class="mb-3 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Gestión de Inventario (.xlsx)</p>
                <input type="file" id="inputExcel" accept=".xlsx" class="mb-4 text-xs block w-full text-slate-400">
                <div class="flex flex-col gap-2">
                    <button onclick="importarExcel()" class="bg-green-700 hover:bg-green-600 px-4 py-3 rounded-xl font-black w-full text-white uppercase text-xs">📥 Subir Excel</button>
                    <button onclick="descargarExcel()" class="bg-blue-700 hover:bg-blue-600 px-4 py-3 rounded-xl font-black w-full text-white uppercase text-xs">📊 Descargar Stock</button>
                </div>
            </div>
        </div>

        <div id="vista-stock" class="hidden">
            <div class="bg-slate-800 p-4 rounded-3xl border border-slate-700 mb-4">
                <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
                    <h2 id="titulo-linea" class="text-2xl font-black text-yellow-500 italic uppercase"></h2>
                    <input id="buscador" onkeyup="filtrar()" placeholder="🔎 Buscar producto..." class="flex-grow max-w-md p-3 rounded-xl bg-slate-900 border border-slate-600 text-white font-bold">
                    <button onclick="volverAlMenu()" class="bg-slate-700 px-6 py-3 rounded-xl font-bold uppercase text-xs">VOLVER</button>
                </div>
                
                <div class="solo-admin grid grid-cols-1 md:grid-cols-5 gap-2 bg-slate-700 p-4 rounded-2xl mb-4 border border-slate-500">
                    <input id="f-ref" placeholder="REF" class="p-2 rounded-lg text-black font-bold uppercase text-sm">
                    <input id="f-desc" placeholder="DESC" class="p-2 rounded-lg text-black font-bold uppercase text-sm">
                    <select id="f-color" class="p-2 rounded-lg text-black font-bold text-sm">
                        <option>CAMBRIAN</option><option>BLANCO</option><option>TIBET</option>
                        <option>ROBLE</option><option>PIZARRA</option><option>GRIS</option>
                        <option>ROBLE/RAYADO</option><option>CAMBRIAN/BLANCO</option>
                        <option>CAMBRIAN/PIZARRA</option><option>BLANCO/PIZARRA</option>
                        <option>TIBET/PIZARRA</option><option>ROBLE/BLANCO</option><option>OTROS</option>
                    </select>
                    <input id="f-rec" type="number" placeholder="CANT" class="p-2 rounded-lg text-black font-bold text-sm">
                    <button onclick="guardarMueble()" class="bg-green-600 text-white font-black rounded-lg p-2 uppercase text-xs">Añadir</button>
                </div>
            </div>

            <div class="bg-slate-800 rounded-3xl border border-slate-700 overflow-hidden shadow-2xl">
                <div class="overflow-x-auto"> 
                    <table class="w-full text-left min-w-[800px]">
                        <thead class="bg-slate-700 text-slate-400 text-[10px] uppercase">
                            <tr>
                                <th class="p-4">REF</th><th class="p-4">DESC</th><th class="p-4">COLOR</th>
                                <th class="p-4 text-center solo-admin">RECIB</th><th class="p-4 text-center solo-admin">VEND</th>
                                <th class="p-4 text-center text-white">STOCK</th>
                                <th class="p-4 text-center col-pedido">PEDIR</th>
                                <th class="p-4 text-center solo-admin">🗑️</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla" class="divide-y divide-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="vista-pedidos" class="hidden">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-black text-emerald-400 italic uppercase">📝 LISTA PEDIDOS</h2>
                    <div class="flex gap-2">
                        <button onclick="descargarExcelPedidos()" class="bg-blue-600 px-4 py-2 rounded-xl font-bold text-xs uppercase text-white">📊 Excel Pedidos</button>
                        <button onclick="volverAlMenu()" class="bg-slate-700 px-4 py-2 rounded-xl font-bold text-xs">VOLVER</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-700 text-slate-400 text-[10px] uppercase">
                            <tr>
                                <th class="p-4">CLIENTE</th><th class="p-4">REF</th><th class="p-4">MUEBLE</th>
                                <th class="p-4 text-center">CANT</th><th class="p-4">FECHA</th>
                                <th class="p-4 text-center">OK</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-pedidos" class="divide-y divide-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let seccionActual = ""; let esAdmin = false;
        const URL_API = "https://stock-escalu-app.onrender.com";

        function verificar() {
            const pass = document.getElementById('input-pass').value.trim().toUpperCase();
            
            // SI ES ADMIN (TÚ)
            if (pass === '12345CUCA') { 
                esAdmin = true; 
                document.body.classList.remove('modo-cliente');
                entrar("ADMINISTRADOR"); 
            } 
            // SI ES CLIENTE O SOFAS (VENDEDORES)
            else if (pass === 'INVITADO' || pass === 'SOFAS') { 
                esAdmin = false; 
                document.body.classList.add('modo-cliente'); 
                entrar(pass); 
            } 
            else { alert("❌ Clave incorrecta"); }
        }

        function entrar(txt) {
            document.getElementById('txt-bienvenida').innerText = txt;
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }

        async function cargarStock(seccion) {
            seccionActual = seccion;
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-stock').classList.remove('hidden');
            document.getElementById('titulo-linea').innerText = seccion;
            const res = await fetch(`${URL_API}/stock/${seccion}`);
            const datos = await res.json();
            const tabla = document.getElementById('cuerpo-tabla');
            tabla.innerHTML = '';
            datos.forEach(m => {
                const stock = m.recepcionadas - m.vendido;
                let colorStock = stock <= 1 ? "text-red-500 font-black animate-pulse" : "text-white";
                tabla.innerHTML += `
                    <tr class="font-bold text-xs">
                        <td class="p-4 text-blue-400 font-mono">${m.ref}</td>
                        <td class="p-4 uppercase">${m.descripcion}</td>
                        <td class="p-4 uppercase text-slate-400">${m.color}</td>
                        <td class="p-4 text-center solo-admin">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="ajustar('${m._id}', ${m.recepcionadas}, 'recepcionadas', -1)" class="bg-red-900/40 w-7 h-7 rounded">-</button>
                                <span class="text-green-400 w-4">${m.recepcionadas}</span>
                                <button onclick="ajustar('${m._id}', ${m.recepcionadas}, 'recepcionadas', 1)" class="bg-green-600 w-7 h-7 rounded">+</button>
                            </div>
                        </td>
                        <td class="p-4 text-center solo-admin">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="ajustar('${m._id}', ${m.vendido}, 'vendido', -1)" class="bg-red-900/40 w-7 h-7 rounded">-</button>
                                <span class="text-orange-400 w-4">${m.vendido}</span>
                                <button onclick="ajustar('${m._id}', ${m.vendido}, 'vendido', 1)" class="bg-orange-600 w-7 h-7 rounded">+</button>
                            </div>
                        </td>
                        <td class="p-4 text-center text-lg ${colorStock}">${stock}</td>
                        <td class="p-4 text-center col-pedido">
                            <button onclick="anotarPedido('${m.ref}', '${m.descripcion}', '${m.color}')" class="bg-emerald-600 px-3 py-1 rounded-lg text-[9px] font-black uppercase">🛒 Pedido</button>
                        </td>
                        <td class="p-4 text-center solo-admin">
                            <button onclick="eliminarMueble('${m._id}')">🗑️</button>
                        </td>
                    </tr>`;
            });
        }

        async function ajustar(id, valorActual, campo, cambio) {
            if (!esAdmin) return;
            let nuevoValor;
            if (campo === 'recepcionadas' && cambio === 1) {
                let cantidad = prompt("¿Unidades recibidas?", "1");
                if (!cantidad) return;
                nuevoValor = valorActual + parseInt(cantidad);
            } else { nuevoValor = Math.max(0, valorActual + cambio); }
            await fetch(`${URL_API}/stock/vender/${id}?${campo}=${nuevoValor}`, { method: 'PUT' });
            cargarStock(seccionActual);
        }

        async function anotarPedido(ref, desc, color) {
            if (!esAdmin) return;
            const cliente = prompt("¿Nombre del Cliente?");
            if (!cliente) return;
            await fetch(`${URL_API}/pedidos/crear`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ cliente, ref, descripcion: desc, color, cantidad: 1 })
            });
            alert("Pedido anotado para " + cliente);
        }

        async function verPedidos() {
            if (!esAdmin) return;
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-pedidos').classList.remove('hidden');
            const res = await fetch(`${URL_API}/pedidos`);
            const datos = await res.json();
            const tabla = document.getElementById('cuerpo-pedidos');
            tabla.innerHTML = '';
            datos.forEach(p => {
                const cant = p.cantidad || 1;
                tabla.innerHTML += `
                    <tr class="font-bold text-xs text-white border-slate-700">
                        <td class="p-4 text-emerald-400 uppercase">${p.cliente}</td>
                        <td class="p-4 font-mono text-blue-300">${p.ref}</td>
                        <td class="p-4 uppercase text-slate-400">${p.descripcion} (${p.color})</td>
                        <td class="p-4 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="ajustarCantPed('${p._id}', ${cant}, -1)" class="bg-red-900/40 w-6 h-6 rounded">-</button>
                                <span class="w-4">${cant}</span>
                                <button onclick="ajustarCantPed('${p._id}', ${cant}, 1)" class="bg-emerald-600 w-6 h-6 rounded">+</button>
                            </div>
                        </td>
                        <td class="p-4 text-slate-500">${p.fecha}</td>
                        <td class="p-4 text-center"><button onclick="borrarPedido('${p._id}')" class="text-xl">✅</button></td>
                    </tr>`;
            });
        }

        async function ajustarCantPed(id, actual, cambio) {
            const nueva = Math.max(1, actual + cambio);
            await fetch(`${URL_API}/pedidos/actualizar/${id}?cantidad=${nueva}`, { method: 'PUT' });
            verPedidos();
        }

        async function borrarPedido(id) {
            if(confirm("¿Pedido finalizado?")) { await fetch(`${URL_API}/pedidos/eliminar/${id}`, { method: 'DELETE' }); verPedidos(); }
        }

        async function guardarMueble() {
            const nuevo = {
                ref: document.getElementById('f-ref').value.toUpperCase(),
                descripcion: document.getElementById('f-desc').value.toUpperCase(),
                color: document.getElementById('f-color').value,
                recepcionadas: parseInt(document.getElementById('f-rec').value) || 0,
                vendido: 0,
                seccion: seccionActual
            };
            if(!nuevo.ref) return alert("Falta REF");
            await fetch(`${URL_API}/stock/agregar`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(nuevo)
            });
            cargarStock(seccionActual);
            document.getElementById('f-ref').value = ""; document.getElementById('f-desc').value = ""; document.getElementById('f-rec').value = "";
        }

        async function importarExcel() {
            const fileInput = document.getElementById('inputExcel');
            if (!fileInput.files[0]) return alert("Elige archivo");
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            await fetch(`${URL_API}/stock/importar`, { method: 'POST', body: formData });
            location.reload();
        }

        function descargarExcel() { window.location.href = `${URL_API}/stock/descargar`; }
        function descargarExcelPedidos() { window.location.href = `${URL_API}/pedidos/descargar`; }
        function volverAlMenu() {
            document.getElementById('vista-stock').classList.add('hidden');
            document.getElementById('vista-pedidos').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }
        async function eliminarMueble(id) {
            if(confirm("¿Borrar?")) { await fetch(`${URL_API}/stock/eliminar/${id}`, {method: 'DELETE'}); cargarStock(seccionActual); }
        }
        function filtrar() {
            let filtro = document.getElementById('buscador').value.toUpperCase();
            let filas = document.getElementById('cuerpo-tabla').getElementsByTagName('tr');
            for (let i = 0; i < filas.length; i++) {
                filas[i].style.display = filas[i].innerText.toUpperCase().includes(filtro) ? "" : "none";
            }
        }
    </script>
</body>
</html>
