<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMMINENT STOCK - SISTEMA REVISADO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* Bloque de control de visibilidad crítico */
        .hidden { display: none !important; }
        .modo-cliente .solo-admin { display: none !important; }
        
        /* Estilos de diseño (basados en tu captura) */
        .bg-card { background-color: #1a2230; }
        .bg-header { background-color: #111827; }
        .btn-accion { width: 36px; height: 36px; border-radius: 10px; font-weight: bold; font-size: 20px; color: white; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
        .btn-accion:active { transform: scale(0.9); opacity: 0.7; }
        
        /* Etiquetas de colores */
        .tag { padding: 4px 10px; border-radius: 6px; font-size: 11px; text-transform: uppercase; font-weight: 800; display: inline-block; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans text-sm">
    <div class="max-w-[1400px] mx-auto p-4">
        
        <div id="pantalla-login" class="mt-20 max-w-md mx-auto bg-card p-8 rounded-3xl text-center border border-slate-700 shadow-2xl">
            <h1 class="text-4xl font-black mb-6 italic tracking-tighter text-white">IMMINENT</h1>
            <input id="input-pass" type="password" placeholder="CONTRASEÑA" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-center text-white text-xl font-bold mb-4 outline-none focus:border-blue-500">
            <button onclick="verificarLogin()" class="w-full bg-blue-600 p-4 rounded-xl font-bold text-xl uppercase shadow-lg active:bg-blue-700 transition">ENTRAR</button>
        </div>

        <div id="menu-secciones" class="hidden text-center">
            <header class="mb-10">
                <h1 class="text-7xl font-black italic tracking-tighter text-white">IMMINENT</h1>
                <p id="label-user" class="text-slate-500 font-bold uppercase text-xs mt-2"></p>
            </header>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 px-2">
                <button onclick="abrirStock('DAKOTA')" class="bg-orange-800 p-8 rounded-3xl font-bold text-xl shadow-lg">🌲 DAKOTA</button>
                <button onclick="abrirStock('DIURNO')" class="bg-sky-600 p-8 rounded-3xl font-bold text-xl shadow-lg">🌅 DIURNO</button>
                <button onclick="abrirStock('NOCTURNO')" class="bg-indigo-900 p-8 rounded-3xl font-bold text-xl shadow-lg">🌙 NOCTURNO</button>
                <button onclick="abrirStock('SOFAS')" class="bg-red-700 p-8 rounded-3xl font-bold text-xl shadow-lg">🛋️ SOFÁS</button>
                <button onclick="abrirStock('ELIAS')" class="bg-purple-700 p-8 rounded-3xl font-bold text-xl border-2 border-purple-400 shadow-lg">📦 ELIAS</button>
                <button onclick="abrirPedidos()" class="solo-admin bg-emerald-600 p-8 rounded-3xl font-bold text-xl border-2 border-emerald-400 shadow-lg">📝 PEDIDOS</button>
            </div>
        </div>

        <div id="vista-stock" class="hidden">
            <div class="flex justify-between items-center mb-6 px-2">
                <h2 id="titulo-linea" class="text-4xl font-black text-yellow-500 italic uppercase"></h2>
                <div class="flex gap-4 items-center">
                    <input id="buscador" onkeyup="ejecutarFiltro()" placeholder="🔎 Buscar..." class="p-3 w-48 md:w-96 rounded-xl bg-card border border-slate-700 text-white outline-none">
                    <button onclick="regresarMenu()" class="bg-slate-700 px-6 py-3 rounded-xl font-bold uppercase text-xs">VOLVER</button>
                </div>
            </div>

            <div class="bg-card rounded-[2rem] border border-slate-800 overflow-hidden shadow-2xl">
                <table class="w-full text-left">
                    <thead class="bg-header text-slate-500 text-[10px] uppercase font-bold">
                        <tr>
                            <th class="p-5">REF</th>
                            <th class="p-5">PRODUCTO</th>
                            <th class="p-5 text-center">RECEPCIONADAS (+)</th>
                            <th class="p-5 text-center">VENDIDAS (+/-)</th>
                            <th class="p-5 text-center">STOCK</th>
                            <th class="p-5 text-center">PEDIR</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-stock" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
        </div>

        <div id="vista-pedidos" class="hidden">
            <div class="bg-card p-6 rounded-[2rem] border border-slate-800 shadow-2xl">
                <div class="flex justify-between items-center mb-8">
                    <h2 id="titulo-pedidos" class="text-4xl font-black text-emerald-400 italic">📝 PEDIDOS ACTIVOS</h2>
                    <div class="flex gap-3">
                        <button id="btn-historial" onclick="cambiarModoPedidos()" class="bg-purple-600 px-6 py-3 rounded-xl font-bold text-xs uppercase">📜 VER HISTORIAL</button>
                        <button onclick="regresarMenu()" class="bg-slate-700 px-6 py-3 rounded-xl font-bold text-xs">VOLVER</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead id="thead-pedidos" class="bg-header text-slate-500 text-xs uppercase font-bold"></thead>
                        <tbody id="tbody-pedidos" class="divide-y divide-slate-800"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const RUTA_API = "https://stock-escalu-app.onrender.com";
        let lineaActiva = ""; 
        let isAdmin = false; 
        let enHistorial = false;
        let cachePedidos = [];

        // --- SISTEMA DE LOGIN ---
        function verificarLogin() {
            const pass = document.getElementById('input-pass').value.trim().toUpperCase();
            if (pass === '12345CUCA') {
                isAdmin = true;
                document.body.classList.remove('modo-cliente');
                document.getElementById('label-user').innerText = "Modo: ADMINISTRADOR";
            } else {
                isAdmin = false;
                document.body.classList.add('modo-cliente');
                document.getElementById('label-user').innerText = "Modo: INVITADO";
            }
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }

        // --- GESTIÓN DE STOCK ---
        async function abrirStock(nombre) {
            lineaActiva = nombre;
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-stock').classList.remove('hidden');
            document.getElementById('titulo-linea').innerText = nombre;
            renderTablaStock();
        }

        async function renderTablaStock() {
            const res = await fetch(`${RUTA_API}/stock/${lineaActiva}`);
            const muebles = await res.json();
            const tabla = document.getElementById('tbody-stock');
            tabla.innerHTML = '';
            
            muebles.forEach(m => {
                const stock = m.recepcionadas - m.vendido;
                tabla.innerHTML += `
                <tr class="hover:bg-slate-800/20 border-slate-800">
                    <td class="p-5 text-blue-400 font-bold font-mono">${m.ref}</td>
                    <td class="p-5 uppercase font-bold text-xs">${m.descripcion} (${m.color})</td>
                    <td class="p-5">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="controlPopUp('${m._id}', 'rec', -1)" class="solo-admin btn-accion bg-red-900 border border-red-700">-</button>
                            <span class="text-lg font-black w-8 text-center">${m.recepcionadas}</span>
                            <button onclick="controlPopUp('${m._id}', 'rec', 1)" class="solo-admin btn-accion bg-emerald-700 border border-emerald-500">+</button>
                        </div>
                    </td>
                    <td class="p-5">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="controlDirecto('${m._id}', 'ven', -1)" class="solo-admin btn-accion bg-red-900 border border-red-700">-</button>
                            <span class="text-lg font-black w-8 text-center">${m.vendido}</span>
                            <button onclick="controlDirecto('${m._id}', 'ven', 1)" class="solo-admin btn-accion bg-emerald-700 border border-emerald-500">+</button>
                        </div>
                    </td>
                    <td class="p-5 text-center text-2xl font-black text-white">${stock}</td>
                    <td class="p-5 text-center">
                        <button onclick="lanzarPedido('${m.ref}', '${m.descripcion}', '${m.color}')" class="bg-emerald-600 px-4 py-2 rounded-lg text-[9px] font-black">🛒 PEDIR</button>
                    </td>
                </tr>`;
            });
        }

        async function controlPopUp(id, tipo, signo) {
            const msg = signo > 0 ? "UNIDADES A SUMAR:" : "UNIDADES A RESTAR:";
            const valor = prompt(msg, "1");
            if (valor && !isNaN(valor)) {
                const total = parseInt(valor) * signo;
                await fetch(`${RUTA_API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${total}`, { method: 'PUT' });
                renderTablaStock();
            }
        }

        async function controlDirecto(id, tipo, valor) {
            await fetch(`${RUTA_API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${valor}`, { method: 'PUT' });
            renderTablaStock();
        }

        // --- GESTIÓN DE PEDIDOS ---
        async function lanzarPedido(ref, desc, color) {
            const cliente = prompt("¿NOMBRE DEL CLIENTE?");
            if (!cliente) return;
            await fetch(`${RUTA_API}/pedidos/crear`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ cliente: cliente.toUpperCase(), ref, descripcion: desc, color, cantidad: 1 })
            });
            alert("ANOTADO CORRECTAMENTE");
        }

        async function abrirPedidos() {
            enHistorial = false;
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-pedidos').classList.remove('hidden');
            renderTablaPedidos();
        }

        async function cambiarModoPedidos() {
            enHistorial = !enHistorial;
            renderTablaPedidos();
        }

        async function renderTablaPedidos() {
            const endpoint = enHistorial ? "/pedidos/historial" : "/pedidos";
            const btn = document.getElementById('btn-historial');
            const titulo = document.getElementById('titulo-pedidos');
            const head = document.getElementById('thead-pedidos');
            const body = document.getElementById('tbody-pedidos');
            
            titulo.innerText = enHistorial ? "📜 HISTORIAL DE CLIENTES" : "📝 PEDIDOS ACTIVOS";
            btn.innerText = enHistorial ? "📝 VER ACTIVOS" : "📜 VER HISTORIAL";
            
            const res = await fetch(`${RUTA_API}${endpoint}`);
            cachePedidos = await res.json();
            body.innerHTML = '';

            if (enHistorial) {
                head.innerHTML = `<tr><th class="p-5">CLIENTE</th><th class="p-5 text-center">ACCIÓN</th></tr>`;
                const clientes = [...new Set(cachePedidos.map(p => p.cliente.toUpperCase()))];
                clientes.forEach(c => {
                    body.innerHTML += `<tr class="border-slate-800"><td class="p-5 text-emerald-400 font-bold">${c}</td><td class="p-5 text-center"><button onclick="bajarExcel('${c}')" class="bg-green-700 px-4 py-2 rounded-lg text-xs font-black">📥 EXCEL</button></td></tr>`;
                });
            } else {
                head.innerHTML = `<tr><th class="p-5">CLIENTE</th><th class="p-5">MUEBLE</th><th class="p-5 text-center">OK</th></tr>`;
                cachePedidos.forEach(p => {
                    body.innerHTML += `<tr class="border-slate-800"><td class="p-5 text-emerald-400 font-bold">${p.cliente}</td><td class="p-5 text-xs text-slate-400 uppercase font-bold">${p.descripcion} (${p.ref})</td><td class="p-5 text-center"><button onclick="finalizarPedido('${p._id}')" class="text-3xl">✅</button></td></tr>`;
                });
            }
        }

        function bajarExcel(cliente) {
            const data = cachePedidos.filter(p => p.cliente.toUpperCase() === cliente).map(p => ({ FECHA: p.fecha, REF: p.ref, DESC: p.descripcion, COLOR: p.color }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "PEDIDO");
            XLSX.writeFile(wb, `Albaran_${cliente}.xlsx`);
        }

        async function finalizarPedido(id) {
            if (confirm("¿MARCAR COMO ENTREGADO?")) {
                await fetch(`${RUTA_API}/pedidos/finalizar/${id}`, { method: 'PUT' });
                renderTablaPedidos();
            }
        }

        // --- NAVEGACIÓN Y FILTROS ---
        function regresarMenu() {
            document.getElementById('vista-stock').classList.add('hidden');
            document.getElementById('vista-pedidos').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }

        function ejecutarFiltro() {
            const f = document.getElementById('buscador').value.toUpperCase();
            const filas = document.getElementById('tbody-stock').getElementsByTagName('tr');
            for (let i = 0; i < filas.length; i++) {
                filas[i].style.display = filas[i].innerText.toUpperCase().includes(f) ? "" : "none";
            }
        }
    </script>
</body>
</html>
