<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMMINENT STOCK - SISTEMA COMPLETO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .hidden { display: none !important; }
        .modo-cliente .solo-admin { display: none !important; }
        .bg-card { background-color: #1a2230; }
        .bg-header { background-color: #111827; }
        .btn-accion { width: 34px; height: 34px; border-radius: 8px; font-weight: bold; font-size: 20px; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-accion:active { transform: scale(0.9); opacity: 0.8; }
        .tag { padding: 4px 10px; border-radius: 6px; font-size: 11px; text-transform: uppercase; font-weight: 800; display: inline-block; }
        .badge-cambrian { background-color: #926239; color: white; }
        .badge-blanco { background-color: #ffffff; color: #000; font-weight: bold; border: 1px solid #ccc; }
        .badge-tibet { background-color: #57534e; color: white; }
        .badge-roble { background-color: #b38b59; color: white; }
        .badge-mix { background: linear-gradient(135deg, #926239 50%, #ffffff 50%); color: #000; border: 1px solid #666; }
        .badge-pizarra { background-color: #334155; color: white; }
        .badge-default { background-color: #1e293b; color: white; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans text-sm">
    <div class="max-w-[1400px] mx-auto p-4">
        
        <div id="pantalla-login" class="mt-20 max-w-md mx-auto bg-card p-8 rounded-3xl text-center border border-slate-700 shadow-2xl">
            <h1 class="text-4xl font-black mb-6 italic tracking-tighter text-white">IMMINENT</h1>
            <input id="input-pass" type="password" placeholder="CLAVE" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-center text-white text-xl font-bold mb-4 outline-none focus:border-blue-500">
            <button onclick="verificar()" class="w-full bg-blue-600 p-4 rounded-xl font-bold text-xl uppercase shadow-lg active:bg-blue-700 transition">ENTRAR</button>
        </div>

        <div id="menu-secciones" class="hidden text-center">
            <header class="mb-10">
                <h1 class="text-7xl font-black italic tracking-tighter text-white">IMMINENT</h1>
                <p id="txt-bienvenida" class="text-slate-400 font-bold mt-2 uppercase"></p>
            </header>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 px-2">
                <button onclick="cargarStock('DAKOTA')" class="bg-orange-800 p-8 rounded-3xl font-bold text-xl shadow-lg">🌲 DAKOTA</button>
                <button onclick="cargarStock('DIURNO')" class="bg-sky-600 p-8 rounded-3xl font-bold text-xl shadow-lg">🌅 DIURNO</button>
                <button onclick="cargarStock('NOCTURNO')" class="bg-indigo-900 p-8 rounded-3xl font-bold text-xl shadow-lg">🌙 NOCTURNO</button>
                <button onclick="cargarStock('SOFAS')" class="bg-red-700 p-8 rounded-3xl font-bold text-xl shadow-lg">🛋️ SOFÁS</button>
                <button onclick="cargarStock('ELIAS')" class="bg-purple-700 p-8 rounded-3xl font-bold text-xl border-2 border-purple-400 shadow-lg">📦 ELIAS</button>
                <button onclick="verPedidos()" class="solo-admin bg-emerald-600 p-8 rounded-3xl font-bold text-xl border-2 border-emerald-400 shadow-lg">📝 PEDIDOS</button>
            </div>
            
            <div class="mt-8 flex justify-center solo-admin">
                <button onclick="descargarStockTotal()" class="bg-blue-600 px-8 py-4 rounded-2xl font-black text-lg shadow-lg border-2 border-blue-400 uppercase active:scale-95 transition">
                    💾 DESCARGAR TODO EL STOCK (Copia de Seguridad)
                </button>
            </div>
        </div>

        <div id="vista-stock" class="hidden">
            
            <div class="solo-admin bg-card p-5 rounded-3xl border border-slate-700 mb-6 shadow-xl">
                <h3 class="text-emerald-400 font-bold mb-4 uppercase text-xs">➕ NUEVO PRODUCTO EN <span id="nombre-linea-form"></span></h3>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                    <input id="new-ref" placeholder="REF" class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-white font-bold outline-none">
                    <input id="new-desc" placeholder="MUEBLE" class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-white outline-none">
                    <select id="new-color" class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-white font-bold outline-none">
                        <option value="CAMBRIAN">CAMBRIAN</option><option value="BLANCO">BLANCO</option>
                        <option value="TIBET">TIBET</option><option value="ROBLE">ROBLE</option>
                        <option value="ROBLE/BLANCO">ROBLE/BLANCO</option><option value="CAMBRIAN/BLANCO">CAMBRIAN/BLANCO</option>
                        <option value="CAMBRIAN/PIZARRA">CAMBRIAN/PIZARRA</option><option value="TIBET/PIZARRA">TIBET/PIZARRA</option>
                    </select>
                    <input id="new-stock" type="number" placeholder="CANT." class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-white outline-none">
                    <button onclick="guardarNuevoProducto()" class="bg-emerald-600 p-3 rounded-xl font-bold uppercase shadow-lg">GUARDAR</button>
                </div>
                
                <div class="mt-4 pt-4 border-t border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
                    <p class="text-xs text-slate-400 font-bold uppercase">📂 Subir varios de golpe desde Excel:</p>
                    <div class="flex gap-2 w-full md:w-auto">
                        <input type="file" id="file-import" accept=".xlsx, .xls" class="text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-700 file:text-white cursor-pointer w-full">
                        <button onclick="importarExcel()" class="bg-blue-600 px-4 py-2 rounded-xl font-bold uppercase text-xs shadow-lg whitespace-nowrap">🚀 SUBIR</button>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-between items-center mb-6 px-2">
                <div class="flex items-center gap-4">
                    <h2 id="titulo-linea" class="text-3xl md:text-4xl font-black text-yellow-500 italic uppercase"></h2>
                    <button onclick="borrarSeccionCompleta()" class="solo-admin text-3xl active:scale-90 transition hover:bg-red-900/50 p-2 rounded-xl" title="BORRAR TODO EL CATÁLOGO">🗑️💥</button>
                </div>
                
                <div class="flex gap-4 items-center">
                    <input id="buscador" onkeyup="filtrar()" placeholder="🔎 Buscar..." class="p-3 w-40 md:w-80 rounded-xl bg-card border border-slate-700 text-white outline-none">
                    <button id="btn-volver-stock" onclick="volverAlMenu()" class="bg-slate-700 px-6 py-3 rounded-xl font-bold uppercase text-xs">VOLVER</button>
                </div>
            </div>

            <div class="bg-card rounded-[2rem] border border-slate-800 overflow-x-auto shadow-2xl">
                <table class="w-full text-left">
                    <thead class="bg-header text-slate-500 text-[10px] uppercase font-bold tracking-widest">
                        <tr>
                            <th class="p-5">REF</th>
                            <th class="p-5">PRODUCTO</th>
                            <th class="p-5">COLOR</th>
                            
                            <th class="p-5 text-center solo-admin">RECEPCIONADAS (POP)</th>
                            <th class="p-5 text-center solo-admin">VENDIDAS (+/-)</th>
                            
                            <th class="p-5 text-center">STOCK</th>
                            
                            <th class="p-5 text-center col-pedido solo-admin">PEDIR</th>
                            <th class="p-5 text-center solo-admin">BORRAR</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
        </div>

        <div id="vista-pedidos" class="hidden">
            <div class="bg-card p-6 rounded-[2rem] border border-slate-800 shadow-2xl">
                <div class="flex justify-between items-center mb-8">
                    <h2 id="titulo-pedidos" class="text-4xl font-black text-emerald-400 italic">📝 PEDIDOS</h2>
                    <div class="flex gap-3">
                        <button onclick="descargarTodosExcel()" class="bg-blue-600 px-6 py-3 rounded-xl font-bold text-xs uppercase shadow-lg">📥 EXCEL GLOBAL</button>
                        <button id="btn-historial" onclick="toggleHistorial()" class="bg-purple-600 px-6 py-3 rounded-xl font-bold text-xs uppercase">📜 VER HISTORIAL</button>
                        <button onclick="volverAlMenu()" class="bg-slate-700 px-6 py-3 rounded-xl font-bold text-xs">VOLVER</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead id="cabecera-pedidos" class="bg-header text-slate-500 text-xs uppercase font-bold"></thead>
                        <tbody id="cuerpo-pedidos" class="divide-y divide-slate-800"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL_API = "https://stock-escalu-app.onrender.com";
        let seccionActual = ""; let esAdmin = false; let viendoHistorial = false; let pedidosCache = [];

        function getClaseColor(color) {
            if (!color) return 'badge-default';
            const c = color.toUpperCase();
            if (c === 'CAMBRIAN') return 'badge-cambrian';
            if (c === 'BLANCO') return 'badge-blanco';
            if (c === 'TIBET') return 'badge-tibet';
            if (c === 'ROBLE') return 'badge-roble';
            if (c.includes('PIZARRA')) return 'badge-pizarra';
            if (c.includes('/')) return 'badge-mix';
            return 'badge-default';
        }

        // --- SISTEMA DE LOGIN Y RESTRICCIONES CERRADO CON CANDADO ---
        function verificar() {
            const pass = document.getElementById('input-pass').value.trim().toUpperCase();
            
            if (pass === '12345CUCA') { 
                // 👑 ADMIN: Entra a todo
                esAdmin = true; 
                document.body.classList.remove('modo-cliente'); 
                document.getElementById('btn-volver-stock').classList.remove('hidden');
                entrar("ADMINISTRADOR"); 
            } 
            else if (pass === 'SOFAS') {
                // 🛋️ SOLO SOFÁS: Entra directo y no puede salir
                esAdmin = false; 
                document.body.classList.add('modo-cliente');
                document.getElementById('pantalla-login').classList.add('hidden');
                document.getElementById('btn-volver-stock').classList.add('hidden');
                cargarStock('SOFAS');
            }
            else if (pass === 'INVITADO') { 
                // 👤 INVITADO: Solo entra si pone la palabra "INVITADO"
                esAdmin = false; 
                document.body.classList.add('modo-cliente'); 
                document.getElementById('btn-volver-stock').classList.remove('hidden');
                entrar("INVITADO"); 
            }
            else { 
                // ❌ CLAVE INCORRECTA O EN BLANCO: Bloqueo
                alert("❌ CONTRASEÑA INCORRECTA. Acceso denegado.");
                document.getElementById('input-pass').value = ""; // Borra lo que haya escrito mal
            }
        }

        function entrar(txt) {
            document.getElementById('txt-bienvenida').innerText = txt;
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }

        // --- TABLA DE STOCK ---
        async function cargarStock(seccion) {
            seccionActual = seccion; 
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-stock').classList.remove('hidden');
            document.getElementById('titulo-linea').innerText = seccion;
            document.getElementById('nombre-linea-form').innerText = seccion;
            
            const res = await fetch(`${URL_API}/stock/${seccion}`);
            const datos = await res.json();
            const tabla = document.getElementById('cuerpo-tabla');
            tabla.innerHTML = '';
            
            datos.forEach(m => {
                const actual = (m.recepcionadas || 0) - (m.vendido || 0);
                const claseCol = getClaseColor(m.color);
                
                tabla.innerHTML += `
                <tr class="hover:bg-slate-800/20 border-slate-800 font-bold">
                    <td class="p-5 text-blue-400 font-mono text-lg">${m.ref}</td>
                    <td class="p-5 uppercase text-xs">${m.descripcion}</td>
                    <td class="p-5"><span class="tag ${claseCol}">${m.color}</span></td>
                    
                    <td class="p-5 solo-admin">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="cambiarConPrompt('${m._id}', 'rec', -1)" class="solo-admin btn-accion bg-red-900 border border-red-700">-</button>
                            <span class="text-xl font-black w-10 text-center">${m.recepcionadas || 0}</span>
                            <button onclick="cambiarConPrompt('${m._id}', 'rec', 1)" class="solo-admin btn-accion bg-emerald-700 border border-emerald-500">+</button>
                        </div>
                    </td>
                    
                    <td class="p-5 solo-admin">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="cambiarDirecto('${m._id}', 'ven', -1)" class="solo-admin btn-accion bg-red-900 border border-red-700">-</button>
                            <span class="text-xl font-black w-10 text-center">${m.vendido || 0}</span>
                            <button onclick="cambiarDirecto('${m._id}', 'ven', 1)" class="solo-admin btn-accion bg-emerald-700 border border-emerald-500">+</button>
                        </div>
                    </td>
                    
                    <td class="p-5 text-center text-3xl font-black text-white">${actual}</td>
                    
                    <td class="p-5 text-center col-pedido solo-admin">
                        <button onclick="anotarPedido('${m._id}', '${m.ref}', '${m.descripcion}', '${m.color}')" class="bg-emerald-600 px-4 py-2 rounded-lg text-[9px] font-black shadow-lg active:scale-95 transition">🛒 PEDIR</button>
                    </td>
                    
                    <td class="p-5 text-center solo-admin">
                        <button onclick="eliminarProducto('${m._id}', '${m.ref}')" class="text-2xl active:scale-90 transition">🗑️</button>
                    </td>
                </tr>`;
            });
            filtrar();
        }

        async function eliminarProducto(id, ref) {
            if (confirm(`⚠️ Vas a borrar completamente el producto ${ref} del stock. ¿Estás seguro?`)) {
                await fetch(`${URL_API}/stock/eliminar/${id}`, { method: 'DELETE' });
                cargarStock(seccionActual); 
            }
        }

        async function cambiarConPrompt(id, tipo, signo) {
            const msj = signo > 0 ? "¿CUÁNTAS UNIDADES LLEGAN?" : "¿CUÁNTAS QUITAS?";
            const num = prompt(msj);
            if (num !== null && num !== "" && !isNaN(num)) {
                const total = parseInt(num) * signo;
                await fetch(`${URL_API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${total}`, { method: 'PUT' });
                cargarStock(seccionActual);
            }
        }

        async function cambiarDirecto(id, tipo, valor) {
            await fetch(`${URL_API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${valor}`, { method: 'PUT' });
            cargarStock(seccionActual);
        }

        async function guardarNuevoProducto() {
            const ref = document.getElementById('new-ref').value.trim().toUpperCase();
            const desc = document.getElementById('new-desc').value.trim().toUpperCase();
            const col = document.getElementById('new-color').value;
            const stock = document.getElementById('new-stock').value || 0;
            
            if(!ref || !desc) return alert("FALTA REF O MUEBLE");
            
            await fetch(`${URL_API}/stock/agregar`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ seccion: seccionActual, ref: ref, descripcion: desc, color: col, recepcionadas: parseInt(stock), vendido: 0 })
            });
            
            alert("GUARDADO CORRECTAMENTE"); 
            cargarStock(seccionActual);
            document.getElementById('new-ref').value = ''; 
            document.getElementById('new-desc').value = '';
            document.getElementById('new-stock').value = '';
        }

        // --- SISTEMA DE PEDIDOS AUTOMATIZADO ---
async function anotarPedido(id, ref, desc, color) {
            const cliente = prompt(`¿NOMBRE DEL CLIENTE para pedir el ${ref}?`);
            if (!cliente) return;
            
            // Apuntamos el pedido en la lista
            await fetch(`${URL_API}/pedidos/crear`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ cliente: cliente.toUpperCase(), ref, descripcion: desc, color, cantidad: 1, id_stock: id })
            });

            // Aviso de que se ha guardado sin tocar el stock
            alert("✅ PEDIDO ANOTADO EN LA LISTA (El stock sigue igual)");
            cargarStock(seccionActual);
        }

        async function verPedidos() {
            viendoHistorial = false;
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-pedidos').classList.remove('hidden');
            document.getElementById('btn-historial').innerText = "📜 VER HISTORIAL";
            
            document.getElementById('cabecera-pedidos').innerHTML = `<tr><th class="p-5">CLIENTE</th><th class="p-5">MUEBLE</th><th class="p-5 text-center">CANT.</th><th class="p-5 text-center">OK</th></tr>`;
            
            const res = await fetch(`${URL_API}/pedidos`);
            pedidosCache = await res.json();
            const tabla = document.getElementById('cuerpo-pedidos');
            tabla.innerHTML = '';
            
            pedidosCache.forEach(p => {
                const cant = p.cantidad || 1;
                const idStock = p.id_stock || ''; // Pillamos el ID secreto del mueble
                
                tabla.innerHTML += `
                <tr class="border-slate-800">
                    <td class="p-5 text-emerald-400 font-bold">${p.cliente}</td>
                    <td class="p-5 text-xs text-slate-400 uppercase font-bold">${p.descripcion}</td>
                    <td class="p-5">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="cambiarCantidadPedido('${p._id}', '${idStock}', ${cant}, -1)" class="solo-admin btn-accion bg-red-900 border border-red-700" style="width: 28px; height: 28px; font-size: 16px;">-</button>
                            <span class="text-xl font-black w-8 text-center">${cant}</span>
                            <button onclick="cambiarCantidadPedido('${p._id}', '${idStock}', ${cant}, 1)" class="solo-admin btn-accion bg-emerald-700 border border-emerald-500" style="width: 28px; height: 28px; font-size: 16px;">+</button>
                        </div>
                    </td>
                    <td class="p-5 text-center">
                        <button onclick="terminar('${p._id}')" class="text-3xl active:scale-90 transition">✅</button>
                    </td>
                </tr>`;
            });
        }

        async function cambiarCantidadPedido(idPedido, idStock, cantidadActual, cambio) {
            const nuevaCanti = cantidadActual + cambio;
            
            if (nuevaCanti < 1) {
                if(confirm("¿La cantidad es 0, quieres dar el pedido por entregado/anulado?")) terminar(idPedido);
                return;
            }
            
            // 1. Actualiza el numerito en el pedido
            await fetch(`${URL_API}/pedidos/actualizar/${idPedido}?cantidad=${nuevaCanti}`, { method: 'PUT' });
            
            // 2. ¡LA MAGIA! Sincroniza con el stock maestro (suma o resta a "vendidas")
            if (idStock) {
                await fetch(`${URL_API}/stock/actualizar/${idStock}?tipo=ven&cantidad=${cambio}`, { method: 'PUT' });
            } else {
                // Aviso por si es un pedido súper antiguo que hiciste antes de poner esta mejora
                console.log("Pedido antiguo sin ID de stock enlazado.");
            }
            
            verPedidos(); // Refresca la tabla al instante
        }

        async function toggleHistorial() {
            viendoHistorial = !viendoHistorial;
            if (viendoHistorial) {
                document.getElementById('btn-historial').innerText = "📝 VER ACTIVOS";
                
                // Añadimos la columna BORRAR (Solo para Administrador)
                document.getElementById('cabecera-pedidos').innerHTML = `<tr><th class="p-5">CLIENTE</th><th class="p-5 text-center">EXCEL</th><th class="p-5 text-center solo-admin">BORRAR</th></tr>`;
                
                const res = await fetch(`${URL_API}/pedidos/historial`);
                pedidosCache = await res.json();
                const tabla = document.getElementById('cuerpo-pedidos');
                tabla.innerHTML = '';
                const clientes = [...new Set(pedidosCache.map(p => p.cliente.toUpperCase()))];
                
                clientes.forEach(c => {
                    tabla.innerHTML += `
                    <tr class="border-slate-800">
                        <td class="p-5 text-emerald-400 font-bold">${c}</td>
                        <td class="p-5 text-center">
                            <button onclick="descargarExcel('${c}')" class="bg-green-700 px-4 py-2 rounded-lg text-xs font-black shadow-lg">📥 EXCEL</button>
                        </td>
                        <td class="p-5 text-center solo-admin">
                            <button onclick="eliminarHistorialCliente('${c}')" class="text-2xl active:scale-90 transition">🗑️</button>
                        </td>
                    </tr>`;
                });
            } else { verPedidos(); }
        }

        // LA FUNCIÓN NUEVA QUE DESTRUYE EL HISTORIAL DE ESE CLIENTE
        async function eliminarHistorialCliente(cliente) {
            if (confirm(`⚠️ ¿Seguro que quieres borrar TODO el historial del cliente ${cliente}? Esto no se puede deshacer.`)) {
                
                // Buscamos todos los muebles que pidió ese cliente en el historial
                const pedidosCliente = pedidosCache.filter(p => p.cliente.toUpperCase() === cliente);
                
                // Los borramos uno a uno de la base de datos
                for (let p of pedidosCliente) {
                    await fetch(`${URL_API}/pedidos/eliminar/${p._id}`, { method: 'DELETE' });
                }
                
                alert(`✅ Historial de ${cliente} borrado para siempre.`);
                
                // Recargamos el historial para que veas cómo desaparece
                viendoHistorial = false; 
                toggleHistorial();
            }
        }

        async function terminar(id) { if (confirm("¿ENTREGADO?")) { await fetch(`${URL_API}/pedidos/finalizar/${id}`, { method: 'PUT' }); verPedidos(); } }
        
        // --- UTILIDADES ---
        function volverAlMenu() { document.getElementById('vista-stock').classList.add('hidden'); document.getElementById('vista-pedidos').classList.add('hidden'); document.getElementById('menu-secciones').classList.remove('hidden'); }
function filtrar() { 
            const terminos = document.getElementById('buscador').value.toUpperCase().trim().split(/\s+/); 
            const filas = document.getElementById('cuerpo-tabla').getElementsByTagName('tr'); 
            for (let i = 0; i < filas.length; i++) { 
                const textoFila = filas[i].innerText.toUpperCase(); 
                const coincide = terminos.every(termino => textoFila.includes(termino)); 
                filas[i].style.display = coincide ? "" : "none"; 
            } 
        }

        // --- SISTEMA DE EXCEL ---
        function descargarExcel(c) {
            const data = pedidosCache.filter(p => p.cliente.toUpperCase() === c).map(p => ({ FECHA: p.fecha, CLIENTE: p.cliente, REF: p.ref, DESC: p.descripcion, COLOR: p.color, UNIDADES: p.cantidad || 1 }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "PEDIDO");
            XLSX.writeFile(wb, `Albaran_${c}.xlsx`);
        }

        function descargarTodosExcel() {
            if (!pedidosCache || pedidosCache.length === 0) return alert("NO HAY PEDIDOS EN LA PANTALLA PARA DESCARGAR");
            const listaGlobal = pedidosCache.map(p => ({ FECHA: p.fecha || "", CLIENTE: p.cliente, REF: p.ref, MUEBLE: p.descripcion, COLOR: p.color || "", UNIDADES: p.cantidad || 1 }));
            const ws = XLSX.utils.json_to_sheet(listaGlobal);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "PEDIDOS TOTALES");
            const hoy = new Date();
            const fecha = hoy.getDate() + "-" + (hoy.getMonth()+1) + "-" + hoy.getFullYear();
            XLSX.writeFile(wb, `Pedidos_Completos_${fecha}.xlsx`);
        }

        async function descargarStockTotal() {
            const secciones = ['DAKOTA', 'DIURNO', 'NOCTURNO', 'SOFAS', 'ELIAS'];
            let stockTotal = [];
            alert("⏳ Recopilando todo el almacén... Dale a Aceptar y espera unos segundos.");
            
            for (let sec of secciones) {
                try {
                    const res = await fetch(`${URL_API}/stock/${sec}`);
                    const datos = await res.json();
                    datos.forEach(d => {
                        stockTotal.push({ SECCION: d.seccion, REF: d.ref, PRODUCTO: d.descripcion, COLOR: d.color, RECEPCIONADAS: d.recepcionadas || 0, VENDIDAS: d.vendido || 0, STOCK_REAL: (d.recepcionadas || 0) - (d.vendido || 0) });
                    });
                } catch (e) { console.error("Error cargando " + sec); }
            }
            if (stockTotal.length === 0) return alert("El almacén está vacío o hay un error de conexión.");
            
            const ws = XLSX.utils.json_to_sheet(stockTotal);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "INVENTARIO TOTAL");
            const hoy = new Date();
            const fecha = hoy.getDate() + "-" + (hoy.getMonth()+1) + "-" + hoy.getFullYear();
            XLSX.writeFile(wb, `Copia_Seguridad_Imminent_${fecha}.xlsx`);
        }

        async function importarExcel() {
            const fileInput = document.getElementById('file-import');
            if (!fileInput.files.length) return alert("⚠️ Selecciona un archivo Excel primero.");
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const filas = XLSX.utils.sheet_to_json(firstSheet);
                
                if (filas.length === 0) return alert("El Excel está vacío.");
                if (!confirm(`Vas a subir ${filas.length} productos a la base de datos. ¿Continuar?`)) return;
                
                alert("⏳ Subiendo productos... No toques nada hasta que salga el aviso de completado.");
                
                for (let fila of filas) {
                    const ref = fila.ref || fila.REF || "";
                    const desc = fila.descripcion || fila.descripcion || fila.DESCRIPCION || "";
                    const col = fila.color || fila.COLOR || "";
                    const rec = parseInt(fila.recepcionadas || 0);
                    const ven = parseInt(fila.vendido || 0);
                    const sec = fila.seccion || fila.SECCION || seccionActual; 
                    
                    if (!ref || !desc) continue;
                    
                    await fetch(`${URL_API}/stock/agregar`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ 
                            seccion: String(sec).toUpperCase(), 
                            ref: String(ref).toUpperCase(), 
                            descripcion: String(desc).toUpperCase(), 
                            color: String(col).toUpperCase(), 
                            recepcionadas: isNaN(rec) ? 0 : rec, 
                            vendido: isNaN(ven) ? 0 : ven 
                        })
                    });
                }
                alert("✅ ¡SUBIDA COMPLETADA CON ÉXITO!");
                fileInput.value = ""; 
                cargarStock(seccionActual); 
            };
            reader.readAsArrayBuffer(file);
        }
        // --- FUNCIÓN NUCLEAR: BORRAR TODA LA SECCIÓN DE GOLPE ---
        async function borrarSeccionCompleta() {
            // El seguro de vida: te obliga a escribir BORRAR en mayúsculas
            const palabra = prompt(`⚠️ ¡PELIGRO RADIACTIVO! ⚠️\n\nVas a borrar TODOS los productos de la sección ${seccionActual} de golpe.\n\nPara confirmar, escribe la palabra BORRAR en mayúsculas:`);
            
            if (palabra === 'BORRAR') {
                try {
                    const res = await fetch(`${URL_API}/stock/eliminar_seccion/${seccionActual}`, { method: 'DELETE' });
                    
                    if (!res.ok) {
                        alert("❌ EL SERVIDOR LO HA BLOQUEADO. Revisa si se guardó bien el app.py en GitHub.");
                        return;
                    }
                    
                    alert(`💥 ¡PUM! Catálogo entero de ${seccionActual} eliminado.`);
                    cargarStock(seccionActual); // Recarga la tabla, que ahora estará vacía
                    
                } catch (err) {
                    alert("❌ Error de conexión: " + err.message);
                }
            } else if (palabra !== null) {
                alert("Cancelado. No has escrito la palabra correcta. ¡Tus muebles están a salvo!");
            }
        }
    </script>
