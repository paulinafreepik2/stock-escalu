<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK IMMINENT - REPARADO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modo-cliente .solo-admin { display: none !important; }
        .tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .bg-cambrian { background: #926239; color: white; }
        .bg-roble { background: #b38b59; color: white; }
        .bg-blanco { background: #fff; color: #000; border: 1px solid #ccc; }
        .btn-accion { width: 40px; height: 40px; border-radius: 8px; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body class="bg-slate-900 text-white p-4">

    <div id="login" class="max-w-md mx-auto mt-20 bg-slate-800 p-6 rounded-2xl shadow-xl text-center">
        <h1 class="text-3xl font-black mb-4">IMMINENT</h1>
        <input id="pass" type="password" placeholder="CLAVE" class="w-full p-3 mb-4 rounded bg-slate-700 text-center uppercase font-bold">
        <button onclick="entrar()" class="w-full bg-blue-600 p-3 rounded font-bold uppercase">Entrar</button>
    </div>

    <div id="menu" class="hidden text-center">
        <h1 class="text-5xl font-black mb-8 italic">IMMINENT</h1>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <button onclick="ver('DAKOTA')" class="bg-orange-800 p-6 rounded-xl font-bold">DAKOTA</button>
            <button onclick="ver('DIURNO')" class="bg-sky-600 p-6 rounded-xl font-bold">DIURNO</button>
            <button onclick="ver('NOCTURNO')" class="bg-indigo-800 p-6 rounded-xl font-bold">NOCTURNO</button>
            <button onclick="ver('SOFAS')" class="bg-red-800 p-6 rounded-xl font-bold">SOFÁS</button>
            <button onclick="ver('ELIAS')" class="bg-purple-800 p-6 rounded-xl font-bold">ELIAS</button>
            <button onclick="verPedidos()" class="solo-admin bg-emerald-700 p-6 rounded-xl font-bold">PEDIDOS</button>
        </div>
    </div>

    <div id="vista-stock" class="hidden">
        <div class="flex justify-between items-center mb-4">
            <h2 id="titulo" class="text-2xl font-black text-yellow-500 uppercase"></h2>
            <button onclick="irMenu()" class="bg-slate-700 px-4 py-2 rounded font-bold">VOLVER</button>
        </div>
        
        <input id="bus" onkeyup="buscar()" placeholder="Buscar producto..." class="w-full p-3 mb-4 rounded bg-slate-800 border border-slate-600">

        <div class="bg-slate-800 rounded-xl overflow-hidden shadow-lg">
            <table class="w-full text-left">
                <thead class="bg-slate-700 text-xs uppercase">
                    <tr>
                        <th class="p-3">REF / MUEBLE</th>
                        <th class="p-3 text-center">RECIBIDAS</th>
                        <th class="p-3 text-center">VENDIDAS</th>
                        <th class="p-3 text-center">STOCK</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo" class="divide-y divide-slate-700"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = "https://stock-escalu-app.onrender.com";
        let seccion = "";
        let esAdmin = false;

        function entrar() {
            const p = document.getElementById('pass').value.toUpperCase();
            if(p === '12345CUCA') { esAdmin = true; } 
            else { esAdmin = false; document.body.classList.add('modo-cliente'); }
            document.getElementById('login').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
        }

        async function ver(s) {
            seccion = s;
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('vista-stock').classList.remove('hidden');
            document.getElementById('titulo').innerText = s;
            cargar();
        }

        async function cargar() {
            const res = await fetch(`${API}/stock/${seccion}`);
            const datos = await res.json();
            const tbody = document.getElementById('tabla-cuerpo');
            tbody.innerHTML = '';

            datos.forEach(m => {
                const stock = m.recepcionadas - m.vendido;
                tbody.innerHTML += `
                    <tr class="border-slate-700">
                        <td class="p-3">
                            <div class="font-bold text-blue-400">${m.ref}</div>
                            <div class="text-xs text-slate-400 uppercase">${m.descripcion}</div>
                            <div class="mt-1"><span class="tag bg-slate-600">${m.color}</span></div>
                        </td>
                        <td class="p-3">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="modificarPop('${m._id}', 'rec', -1)" class="solo-admin btn-accion bg-red-700">-</button>
                                <span class="text-lg font-bold w-8 text-center">${m.recepcionadas}</span>
                                <button onclick="modificarPop('${m._id}', 'rec', 1)" class="solo-admin btn-accion bg-emerald-600">+</button>
                            </div>
                        </td>
                        <td class="p-3">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="modificarDirecto('${m._id}', 'ven', -1)" class="solo-admin btn-accion bg-red-700">-</button>
                                <span class="text-lg font-bold w-8 text-center">${m.vendido}</span>
                                <button onclick="modificarDirecto('${m._id}', 'ven', 1)" class="solo-admin btn-accion bg-emerald-600">+</button>
                            </div>
                        </td>
                        <td class="p-3 text-center text-2xl font-black text-yellow-500">${stock}</td>
                    </tr>
                `;
            });
        }

        // ESTA ES LA FUNCIÓN QUE FALLABA, AHORA ESTÁ REHECHA
        async function modificarPop(id, tipo, signo) {
            let cantidad = prompt("¿Cuántas unidades?");
            if (cantidad !== null && cantidad !== "" && !isNaN(cantidad)) {
                let valorFinal = parseInt(cantidad) * signo;
                try {
                    await fetch(`${API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${valorFinal}`, { method: 'PUT' });
                    cargar(); // Recargar la tabla
                } catch (err) {
                    alert("Error al conectar con el servidor");
                }
            }
        }

        async function modificarDirecto(id, tipo, valor) {
            await fetch(`${API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${valor}`, { method: 'PUT' });
            cargar();
        }

        function irMenu() {
            document.getElementById('vista-stock').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
        }

        function buscar() {
            let f = document.getElementById('bus').value.toUpperCase();
            let filas = document.getElementById('tabla-cuerpo').getElementsByTagName('tr');
            for (let i = 0; i < filas.length; i++) {
                filas[i].style.display = filas[i].innerText.toUpperCase().includes(f) ? "" : "none";
            }
        }
    </script>
</body>
</html>
