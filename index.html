<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMMINENT STOCK PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .modo-cliente .solo-admin { display: none !important; }
        .badge-cambrian { background-color: #926239; color: white; }
        .badge-blanco { background-color: #ffffff; color: #000; font-weight: bold; border: 1px solid #ccc; }
        .badge-tibet { background-color: #57534e; color: white; }
        .badge-roble { background-color: #b38b59; color: white; }
        .badge-mix { background: linear-gradient(135deg, #926239 50%, #ffffff 50%); color: #000; border: 1px solid #666; }
        .badge-pizarra { background-color: #334155; color: white; }
        .tag { padding: 4px 10px; border-radius: 6px; font-size: 11px; text-transform: uppercase; font-weight: 800; display: inline-block; }
        .btn-stock { width: 36px; height: 36px; border-radius: 10px; font-weight: bold; font-size: 20px; color: white; }
        .btn-stock:active { transform: scale(0.9); opacity: 0.8; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans text-sm">
    <div class="max-w-[1400px] mx-auto p-2 md:p-4">
        
        <div id="pantalla-login" class="mt-20 max-w-md mx-auto bg-slate-800 p-8 rounded-3xl text-center border border-slate-700 shadow-2xl">
            <h1 class="text-4xl font-black mb-6 italic tracking-tighter">IMMINENT</h1>
            <input id="input-pass" type="password" placeholder="CLAVE" class="w-full p-4 rounded-xl bg-slate-950 border border-slate-700 text-center text-white text-xl font-bold mb-4 outline-none">
            <button onclick="verificar()" class="w-full bg-blue-600 p-4 rounded-xl font-bold text-xl uppercase shadow-lg">Entrar</button>
        </div>

        <div id="menu-secciones" class="hidden text-center">
            <header class="mb-10">
                <h1 class="text-7xl font-black italic tracking-tighter">IMMINENT</h1>
                <p id="txt-bienvenida" class="text-slate-400 font-bold mt-2 uppercase"></p>
            </header>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-10 px-2">
                <button onclick="cargarStock('DAKOTA')" class="bg-orange-800 p-8 rounded-3xl font-bold text-xl shadow-lg">🌲 DAKOTA</button>
                <button onclick="cargarStock('DIURNO')" class="bg-sky-600 p-8 rounded-3xl font-bold text-xl shadow-lg">🌅 DIURNO</button>
                <button onclick="cargarStock('NOCTURNO')" class="bg-indigo-900 p-8 rounded-3xl font-bold text-xl shadow-lg">🌙 NOCTURNO</button>
                <button onclick="cargarStock('SOFAS')" class="bg-red-700 p-8 rounded-3xl font-bold text-xl shadow-lg">🛋️ SOFÁS</button>
                <button onclick="cargarStock('ELIAS')" class="bg-purple-700 p-8 rounded-3xl font-bold text-xl border-2 border-purple-400 shadow-lg">📦 ELIAS</button>
                <button onclick="verPedidos()" class="solo-admin bg-emerald-600 p-8 rounded-3xl font-bold text-xl border-2 border-emerald-400 shadow-lg">📝 PEDIDOS</button>
            </div>
        </div>

        <div id="vista-stock" class="hidden">
            <div class="solo-admin bg-slate-800 p-5 rounded-3xl border border-slate-700 mb-6 shadow-xl">
                <h3 class="text-emerald-400 font-bold mb-4 uppercase text-xs">➕ NUEVO PRODUCTO EN <span id="nombre-linea-form"></span></h3>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                    <input id="new-ref" placeholder="REF" class="bg-slate-900 p-3 rounded-xl border border-slate-600 text-white uppercase font-bold outline-none">
                    <input id="new-desc" placeholder="MUEBLE" class="bg-slate-900 p-3 rounded-xl border border-slate-600 text-white uppercase outline-none">
                    <select id="new-color" class="bg-slate-900 p-3 rounded-xl border border-slate-600 text-white font-bold outline-none">
                        <option value="CAMBRIAN">CAMBRIAN</option><option value="BLANCO">BLANCO</option>
                        <option value="TIBET">TIBET</option><option value="ROBLE">ROBLE</option>
                        <option value="ROBLE/BLANCO">ROBLE/BLANCO</option><option value="CAMBRIAN/BLANCO">CAMBRIAN/BLANCO</option>
                        <option value="CAMBRIAN/PIZARRA">CAMBRIAN/PIZARRA</option><option value="TIBET/PIZARRA">TIBET/PIZARRA</option>
                        <option value="BLANCO/PIZARRA">BLANCO/PIZARRA</option><option value="ROBLE/RAYADO">ROBLE/RAYADO</option>
                    </select>
                    <input id="new-stock-ini" type="number" placeholder="STOCK INICIAL" class="bg-slate-900 p-3 rounded-xl border border-slate-600 text-white outline-none">
                    <button onclick="guardarNuevoProducto()" class="bg-emerald-600 p-3 rounded-xl font-bold uppercase shadow-lg">Guardar</button>
                </div>
            </div>

            <div class="bg-slate-800 p-4 rounded-3xl border border-slate-700 mb-4 flex justify-between items-center gap-4">
                <h2 id="titulo-linea" class="text-3xl font-black text-yellow-500 italic uppercase ml-2"></h2>
                <input id="buscador" onkeyup="filtrar()" placeholder="🔎 BUSCAR..." class="flex-grow max-w-2xl p-4 rounded-2xl bg-slate-900 border border-slate-600 text-white font-bold outline-none">
                <button onclick="volverAlMenu()" class="bg-slate-700 px-8 py-4 rounded-2xl font-bold uppercase text-xs">VOLVER</button>
            </div>

            <div class="bg-slate-800 rounded-[2rem] border border-slate-700 overflow-hidden shadow-2xl">
                <table class="w-full text-left">
                    <thead class="bg-slate-700/50 text-slate-400 text-xs uppercase">
                        <tr>
                            <th class="p-5">REF</th><th class="p-5">MUEBLE</th><th class="p-5">COLOR</th>
                            <th class="p-5 text-center">RECIBIDAS (POP-UP)</th>
                            <th class="p-5 text-center">VENDIDAS (+/- 1)</th>
                            <th class="p-5 text-center text-yellow-500 font-black">STOCK</th>
                            <th class="p-5 text-center col-pedido">PEDIR</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </div>

        <div id="vista-pedidos" class="hidden">
            <div class="bg-slate-800 p-6 rounded-[2rem] border border-slate-700 shadow-2xl text-center">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-4xl font-black text-emerald-400 italic">📝 PEDIDOS</h2>
                    <button onclick="volverAlMenu()" class="bg-slate-700 px-6 py-3 rounded-xl font-bold text-xs">VOLVER</button>
                </div>
                <div class="overflow-x-auto"><table class="w-full text-left"><thead id="cabecera-pedidos" class="bg-slate-700/50 text-slate-400 text-xs uppercase"></thead><tbody id="cuerpo-pedidos" class="divide-y divide-slate-700"></tbody></table></div>
            </div>
        </div>
    </div>

    <script>
        let seccionActual = ""; let esAdmin = false; let pedidosCache = [];
        const URL_API = "https://stock-escalu-app.onrender.com";

        function getClaseColor(color) {
            if (!color) return 'bg-slate-700';
            const c = color.toUpperCase();
            if (c === 'CAMBRIAN') return 'badge-cambrian';
            if (c === 'BLANCO') return 'badge-blanco';
            if (c === 'TIBET') return 'badge-tibet';
            if (c === 'ROBLE') return 'badge-roble';
            if (c.includes('PIZARRA')) return 'badge-pizarra';
            if (c.includes('/')) return 'badge-mix';
            return 'bg-slate-700';
        }

        function verificar() {
            const pass = document.getElementById('input-pass').value.trim().toUpperCase();
            if (pass === '12345CUCA') { esAdmin = true; document.body.classList.remove('modo-cliente'); entrar("ADMIN"); }
            else { esAdmin = false; document.body.classList.add('modo-cliente'); entrar("INVITADO"); }
        }

        function entrar(txt) {
            document.getElementById('txt-bienvenida').innerText = txt;
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }

        async function cargarStock(seccion) {
            seccionActual = seccion;
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-stock').classList.remove('hidden');
            document.getElementById('titulo-linea').innerText = seccion;
            document.getElementById('nombre-linea-form').innerText = seccion;
            
            const res = await fetch(`${URL_API}/stock/${seccion}`);
            const datos = await res.json();
            const tabla = document.getElementById('cuerpo-tabla');
            tabla.innerHTML = '';
            
            datos.forEach(m => {
                const actual = m.recepcionadas - m.vendido;
                const claseCol = getClaseColor(m.color);
                tabla.innerHTML += `
                <tr class="font-bold border-slate-700">
                    <td class="p-5 text-blue-400 font-mono text-lg">${m.ref}</td>
                    <td class="p-5 uppercase text-slate-200 text-sm">${m.descripcion}</td>
                    <td class="p-5 uppercase"><span class="tag ${claseCol}">${m.color}</span></td>
                    <td class="p-5 text-center">
                        <div class="flex items-center justify-center gap-3">
                            <button onclick="ventanaStock('${m._id}', 'rec', -1)" class="solo-admin btn-stock bg-red-900 border border-red-700">-</button>
                            <span class="w-10 text-center text-xl font-black">${m.recepcionadas}</span>
                            <button onclick="ventanaStock('${m._id}', 'rec', 1)" class="solo-admin btn-stock bg-emerald-700 border border-emerald-500">+</button>
                        </div>
                    </td>
                    <td class="p-5 text-center">
                        <div class="flex items-center justify-center gap-3">
                            <button onclick="manualStock('${m._id}', 'ven', -1)" class="solo-admin btn-stock bg-red-900 border border-red-700">-</button>
                            <span class="w-10 text-center text-xl font-black">${m.vendido}</span>
                            <button onclick="manualStock('${m._id}', 'ven', 1)" class="solo-admin btn-stock bg-emerald-700 border border-emerald-500">+</button>
                        </div>
                    </td>
                    <td class="p-5 text-center text-3xl text-yellow-500 font-black">${actual}</td>
                    <td class="p-5 text-center col-pedido">
                        <button onclick="anotarPedido('${m.ref}', '${m.descripcion}', '${m.color}')" class="bg-emerald-600 px-4 py-2 rounded-lg text-xs font-black shadow-lg">🛒 PEDIR</button>
                    </td>
                </tr>`;
            });
        }

        // --- ARREGLO DE BOTONES ---
        async function ventanaStock(id, tipo, signo) {
            let num = prompt("¿CUÁNTAS UNIDADES?");
            if (num != null && num != "" && !isNaN(num)) {
                let valor = parseInt(num) * signo;
                // Usamos la ruta /stock/actualizar que es la que responde el servidor
                await fetch(`${URL_API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${valor}`, { method: 'PUT' });
                cargarStock(seccionActual); // Recarga la tabla para ver el cambio
            }
        }

        async function manualStock(id, tipo, valor) {
            await fetch(`${URL_API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${valor}`, { method: 'PUT' });
            cargarStock(seccionActual);
        }

        async function guardarNuevoProducto() {
            const ref = document.getElementById('new-ref').value.toUpperCase();
            const desc = document.getElementById('new-desc').value.toUpperCase();
            const col = document.getElementById('new-color').value;
            const stock = document.getElementById('new-stock-ini').value || 0;
            if(!ref) return alert("FALTA REF");
            await fetch(`${URL_API}/stock/agregar`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ seccion: seccionActual, ref, descripcion: desc, color: col, recepcionadas: parseInt(stock), vendido: 0 })
            });
            alert("GUARDADO"); cargarStock(seccionActual);
        }

        async function anotarPedido(ref, desc, color) {
            const cliente = prompt("¿CLIENTE?");
            if (!cliente) return;
            await fetch(`${URL_API}/pedidos/crear`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ cliente: cliente.toUpperCase(), ref, descripcion: desc, color, cantidad: 1 })
            });
            alert("ANOTADO");
        }

        async function verPedidos() {
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-pedidos').classList.remove('hidden');
            document.getElementById('cabecera-pedidos').innerHTML = `<tr><th class="p-5">CLIENTE</th><th class="p-5">MUEBLE</th><th class="p-5 text-center">OK</th></tr>`;
            const res = await fetch(`${URL_API}/pedidos`);
            pedidosCache = await res.json();
            const tabla = document.getElementById('cuerpo-pedidos');
            tabla.innerHTML = '';
            pedidosCache.forEach(p => {
                tabla.innerHTML += `<tr class="font-bold border-slate-700"><td class="p-5 text-emerald-400 text-lg uppercase">${p.cliente}</td><td class="p-5 text-xs uppercase text-slate-400">${p.descripcion} (${p.ref})</td><td class="p-5 text-center"><button onclick="terminar('${p._id}')" class="text-3xl">✅</button></td></tr>`;
            });
        }

        async function terminar(id) {
            if (confirm("¿ENTREGADO?")) { await fetch(`${URL_API}/pedidos/finalizar/${id}`, { method: 'PUT' }); verPedidos(); }
        }

        function volverAlMenu() {
            document.getElementById('vista-stock').classList.add('hidden');
            document.getElementById('vista-pedidos').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }

        function filtrar() {
            let f = document.getElementById('buscador').value.toUpperCase();
            let filas = document.getElementById('cuerpo-tabla').getElementsByTagName('tr');
            for (let i = 0; i < filas.length; i++) { filas[i].style.display = filas[i].innerText.toUpperCase().includes(f) ? "" : "none"; }
        }
    </script>
</body>
</html>
