<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK IMMINENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modo-cliente .solo-admin { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="max-w-6xl mx-auto p-2 md:p-4">
        
        <div id="pantalla-login" class="mt-20 max-w-md mx-auto bg-slate-800 p-8 rounded-3xl text-center border border-slate-700 shadow-2xl">
            <h1 class="text-4xl font-black mb-6 italic tracking-tighter">IMMINENT</h1>
            <input id="input-pass" type="text" placeholder="Clave" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-600 mb-4 text-center text-white text-xl">
            <button onclick="verificar()" class="w-full bg-blue-600 p-4 rounded-xl font-bold text-xl uppercase shadow-lg active:scale-95 transition">Entrar</button>
        </div>

        <div id="menu-secciones" class="hidden text-center">
            <header class="mb-10">
                <h1 class="text-6xl font-black italic text-white tracking-tighter">IMMINENT</h1>
                <p id="txt-bienvenida" class="text-slate-400 font-bold mt-2 uppercase bg-slate-800 inline-block px-4 py-1 rounded-full text-sm"></p>
            </header>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <button onclick="cargarStock('DAKOTA')" class="bg-orange-800 p-8 rounded-3xl text-2xl font-bold shadow-xl hover:scale-105 transition">🌲 DAKOTA</button>
                <button onclick="cargarStock('DIURNO')" class="bg-sky-600 p-8 rounded-3xl text-2xl font-bold shadow-xl hover:scale-105 transition">🌅 DIURNO</button>
                <button onclick="cargarStock('NOCTURNO')" class="bg-indigo-900 p-8 rounded-3xl text-2xl font-bold shadow-xl hover:scale-105 transition">🌙 NOCTURNO</button>
                <button onclick="cargarStock('SOFAS')" class="bg-red-700 p-8 rounded-3xl text-2xl font-bold shadow-xl hover:scale-105 transition">🛋️ SOFÁS</button>
            </div>

            <div class="solo-admin mt-12 p-6 bg-slate-800 rounded-3xl border border-slate-700 max-w-sm mx-auto shadow-xl">
                <p class="mb-3 font-bold text-slate-400 uppercase text-xs tracking-widest">Carga Masiva (Excel .xlsx)</p>
                <input type="file" id="inputExcel" accept=".xlsx" class="mb-4 text-xs block w-full text-slate-400 cursor-pointer">
                <button onclick="importarExcel()" class="bg-green-700 hover:bg-green-600 px-4 py-3 rounded-xl font-black w-full transition active:scale-95 text-white uppercase">Subir Excel</button>
            </div>
        </div>

        <div id="vista-stock" class="hidden mt-2">
            <div class="bg-slate-800 p-4 rounded-3xl border border-slate-700 mb-6 shadow-lg">
                <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                    <h2 id="titulo-linea" class="text-3xl font-black text-yellow-500 italic uppercase"></h2>
                    <input id="buscador" onkeyup="filtrar()" placeholder="🔎 Buscar..." class="flex-grow max-w-md p-3 rounded-xl bg-slate-900 border border-slate-600 text-white font-bold">
                    <button onclick="volverAlMenu()" class="bg-slate-700 px-6 py-3 rounded-xl font-bold hover:bg-slate-600 transition uppercase">Volver</button>
                </div>
                
                <div class="solo-admin grid grid-cols-1 md:grid-cols-5 gap-3 bg-slate-700 p-4 rounded-2xl">
                    <input id="f-ref" placeholder="REF" class="p-3 rounded-xl text-black font-bold uppercase">
                    <input id="f-desc" placeholder="DESCRIPCIÓN" class="p-3 rounded-xl text-black font-bold uppercase">
                    <select id="f-color" class="p-3 rounded-xl text-black font-bold">
                        <option>CAMBRIAN</option><option>BLANCO</option><option>TIBET</option><option>ROBLE</option><option>PIZARRA</option>
                        <option>CAMBRIAN/BLANCO</option><option>TIBET/PIZARRA</option><option>CAMBRIAN/PIZARRA</option><option>ROBLE/BLANCO</option><option>GRIS</option>
                    </select>
                    <input id="f-rec" type="number" placeholder="CANTIDAD" class="p-3 rounded-xl text-black font-bold">
                    <button onclick="guardarMueble()" class="bg-green-600 text-white font-black rounded-xl p-3 hover:bg-green-500 transition">AÑADIR</button>
                </div>
            </div>

            <div class="bg-slate-800 rounded-3xl border border-slate-700 overflow-hidden shadow-2xl">
                <div class="overflow-x-auto"> 
                    <table class="w-full text-left min-w-[800px]">
                        <thead class="bg-slate-700 text-slate-300 text-xs font-black uppercase tracking-wider">
                            <tr>
                                <th class="p-4">REF</th>
                                <th class="p-4">DESCRIPCIÓN</th>
                                <th class="p-4">COLOR</th>
                                <th class="p-4 text-center solo-admin">RECIBIDAS</th>
                                <th class="p-4 text-center solo-admin">VENDIDO</th>
                                <th class="p-4 text-center text-white font-bold text-lg">STOCK</th>
                                <th class="p-4 text-center solo-admin">ELIMINAR</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla" class="divide-y divide-slate-700 font-bold"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let seccionActual = "";
        let esAdmin = false;
        const URL_API = "https://stock-escalu-app.onrender.com";

        function verificar() {
            const pass = document.getElementById('input-pass').value.trim().toUpperCase();
            if (pass === '12345CUCA') {
                esAdmin = true; entrar("Panel Control IMMINENT");
            } else if (pass === 'INVITADO') {
                esAdmin = false; document.body.classList.add('modo-cliente'); entrar("Catálogo IMMINENT");
            } else { alert("❌ Clave incorrecta"); }
        }

        function entrar(txt) {
            document.getElementById('txt-bienvenida').innerText = txt;
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }

        async function cargarStock(seccion) {
            seccionActual = seccion;
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-stock').classList.remove('hidden');
            document.getElementById('titulo-linea').innerText = "LÍNEA " + seccion;

            const res = await fetch(`${URL_API}/stock/${seccion}`);
            const datos = await res.json();
            const tabla = document.getElementById('cuerpo-tabla');
            tabla.innerHTML = '';
            
            datos.forEach(m => {
                const stock = m.recepcionadas - m.vendido;
                let colorStock = stock <= 1 ? "text-red-500 animate-pulse text-2xl" : "text-white text-xl";
                if (stock <= 0) colorStock = "text-slate-600";

                tabla.innerHTML += `
                    <tr class="hover:bg-slate-700/50 transition border-slate-700">
                        <td class="p-4 text-blue-400 font-mono font-bold uppercase">${m.ref}</td>
                        <td class="p-4 text-sm uppercase">${m.descripcion}</td>
                        <td class="p-4 text-xs font-normal uppercase">${m.color}</td>
                        <td class="p-4 text-center solo-admin">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="ajustar('${m._id}', ${m.recepcionadas}, 'recepcionadas', -1)" class="bg-red-600/40 w-8 h-8 rounded-lg flex items-center justify-center font-black">-</button>
                                <span class="text-green-400 w-6 text-center">${m.recepcionadas}</span>
                                <button onclick="ajustar('${m._id}', ${m.recepcionadas}, 'recepcionadas', 1)" class="bg-green-600 w-8 h-8 rounded-lg flex items-center justify-center font-black">+</button>
                            </div>
                        </td>
                        <td class="p-4 text-center solo-admin">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="ajustar('${m._id}', ${m.vendido}, 'vendido', -1)" class="bg-red-600/40 w-8 h-8 rounded-lg flex items-center justify-center font-black">-</button>
                                <span class="text-orange-400 w-6 text-center">${m.vendido}</span>
                                <button onclick="ajustar('${m._id}', ${m.vendido}, 'vendido', 1)" class="bg-orange-600 w-8 h-8 rounded-lg flex items-center justify-center font-black">+</button>
                            </div>
                        </td>
                        <td class="p-4 text-center font-black ${colorStock}">${stock > 0 ? stock : 'AGOTADO'}</td>
                        <td class="p-4 text-center solo-admin">
                            <button onclick="eliminarMueble('${m._id}')" class="text-red-500 text-xl hover:scale-110 transition">🗑️</button>
                        </td>
                    </tr>`;
            });
        }

        async function ajustar(id, valorActual, campo, cambio) {
            const nuevoValor = Math.max(0, valorActual + cambio);
            await fetch(`${URL_API}/stock/vender/${id}?${campo}=${nuevoValor}`, { method: 'PUT' });
            cargarStock(seccionActual);
        }

        async function guardarMueble() {
            const nuevo = {
                ref: document.getElementById('f-ref').value.toUpperCase(),
                descripcion: document.getElementById('f-desc').value.toUpperCase(),
                color: document.getElementById('f-color').value,
                recepcionadas: parseInt(document.getElementById('f-rec').value) || 0,
                vendido: 0,
                seccion: seccionActual
            };
            await fetch(`${URL_API}/stock/agregar`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(nuevo)
            });
            document.getElementById('f-ref').value = "";
            document.getElementById('f-desc').value = "";
            document.getElementById('f-rec').value = "";
            cargarStock(seccionActual);
        }

        async function importarExcel() {
            const fileInput = document.getElementById('inputExcel');
            if (!fileInput.files[0]) return alert("Selecciona un archivo .xlsx");
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            try {
                const res = await fetch(`${URL_API}/stock/importar`, { method: 'POST', body: formData });
                const data = await res.json();
                alert(data.msg || "Error: " + data.error);
                location.reload();
            } catch (e) { alert("Error de conexión"); }
        }

        function volverAlMenu() {
            document.getElementById('vista-stock').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }

        async function eliminarMueble(id) {
            if(confirm("¿Borrar definitivamente?")) {
                await fetch(`${URL_API}/stock/eliminar/${id}`, {method: 'DELETE'});
                cargarStock(seccionActual);
            }
        }

        function filtrar() {
            let filtro = document.getElementById('buscador').value.toUpperCase();
            let filas = document.getElementById('cuerpo-tabla').getElementsByTagName('tr');
            for (let i = 0; i < filas.length; i++) {
                filas[i].style.display = filas[i].innerText.toUpperCase().includes(filtro) ? "" : "none";
            }
        }
    </script>
</body>
</html>
