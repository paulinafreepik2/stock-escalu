<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMMINENT STOCK PRO</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
.modo-cliente .solo-admin { display: none !important; }
.modo-cliente .col-pedido { display: none !important; }

.tag { padding:4px 10px;border-radius:6px;font-size:11px;font-weight:800 }

.btn-stock {
    width:32px;height:32px;border-radius:8px;
    font-weight:bold;font-size:20px;
}
</style>
</head>

<body class="bg-slate-900 text-white font-sans text-sm">

<div class="max-w-[1400px] mx-auto p-4">

<!-- LOGIN -->
<div id="pantalla-login" class="mt-20 max-w-md mx-auto bg-slate-800 p-8 rounded-3xl text-center">
    <h1 class="text-4xl font-black mb-6">IMMINENT</h1>
    <input id="input-pass" type="password" placeholder="CLAVE" class="w-full p-4 rounded-xl bg-slate-900 mb-4 text-center">
    <button onclick="verificar()" class="w-full bg-blue-600 p-4 rounded-xl font-bold">Entrar</button>
</div>

<!-- MENU -->
<div id="menu-secciones" class="hidden text-center">
    <h1 class="text-6xl font-black mb-6">IMMINENT</h1>

    <button onclick="cargarStock('SOFAS')" class="bg-red-700 p-6 rounded-xl">SOFAS</button>
    <button onclick="verPedidos()" class="solo-admin bg-green-600 p-6 rounded-xl">PEDIDOS</button>
</div>

<!-- STOCK -->
<div id="vista-stock" class="hidden">

<h2 id="titulo-linea" class="text-3xl mb-4"></h2>

<input id="buscador" onkeyup="filtrar()" placeholder="BUSCAR..." class="w-full p-3 mb-4 bg-slate-800">

<table class="w-full">
<thead>
<tr>
<th>REF</th>
<th>DESC</th>
<th>COLOR</th>
<th>REC</th>
<th>VEN</th>
<th>STOCK</th>
</tr>
</thead>

<tbody id="cuerpo-tabla"></tbody>
</table>

<button onclick="volverAlMenu()" class="mt-4 bg-slate-700 p-3 rounded">VOLVER</button>

</div>

</div>

<script>

let seccionActual = "";
let esAdmin = false;

const URL_API = "https://stock-escalu-app.onrender.com";

/* ================= SAFE FETCH ================= */

async function safeFetch(url, options = {}) {
    try {
        const res = await fetch(url, options);
        if (!res.ok) throw new Error("Error servidor");
        return await res.json().catch(()=>({}));
    } catch (e) {
        alert("Error conexión servidor");
        console.error(e);
        return null;
    }
}

/* ================= LOGIN ================= */

function verificar(){
    const pass = document.getElementById('input-pass').value;

    if(pass === "12345CUCA"){
        esAdmin = true;
        entrar();
    } else {
        document.body.classList.add('modo-cliente');
        entrar();
    }
}

function entrar(){
    document.getElementById('pantalla-login').classList.add('hidden');
    document.getElementById('menu-secciones').classList.remove('hidden');
}

/* ================= STOCK ================= */

function getClaseColor(c){
    if(!c) return "";
    c = c.toUpperCase();
    if(c.includes("BLANCO")) return "bg-white text-black";
    if(c.includes("CAMBRIAN")) return "bg-yellow-700";
    return "bg-slate-700";
}

async function cargarStock(seccion){

    seccionActual = seccion;

    document.getElementById('menu-secciones').classList.add('hidden');
    document.getElementById('vista-stock').classList.remove('hidden');
    document.getElementById('titulo-linea').innerText = seccion;

    const datos = await safeFetch(`${URL_API}/stock/${seccion}`);
    if(!datos) return;

    const tabla = document.getElementById('cuerpo-tabla');

    let html = "";

    datos.forEach(m => {

        const stock = m.recepcionadas - m.vendido;

        html += `
        <tr>
            <td>${m.ref}</td>
            <td>${m.descripcion}</td>
            <td><span class="tag ${getClaseColor(m.color)}">${m.color}</span></td>

            <td>
                <button onclick="manualStock('${m._id}','rec',-1)">-</button>
                <span>${m.recepcionadas}</span>
                <button onclick="manualStock('${m._id}','rec',1)">+</button>
            </td>

            <td>
                <button onclick="manualStock('${m._id}','ven',-1)">-</button>
                <span>${m.vendido}</span>
                <button onclick="manualStock('${m._id}','ven',1)">+</button>
            </td>

            <td>${stock}</td>
        </tr>
        `;
    });

    tabla.innerHTML = html;
}

/* ================= UPDATE SIN RECARGAR ================= */

async function manualStock(id, tipo, valor){

    const ok = await safeFetch(`${URL_API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${valor}`, {method:'PUT'});
    if(!ok) return;

    const fila = document.querySelector(`button[onclick*="${id}"]`).closest('tr');

    const spans = fila.querySelectorAll('span');

    let rec = parseInt(spans[0].innerText);
    let ven = parseInt(spans[1].innerText);

    if(tipo==="rec") rec += valor;
    if(tipo==="ven") ven += valor;

    spans[0].innerText = rec;
    spans[1].innerText = ven;

    fila.children[5].innerText = rec - ven;
}

/* ================= PEDIDOS ================= */

function verPedidos(){
    alert("Aquí irían pedidos (no modificado)");
}

/* ================= OTROS ================= */

function volverAlMenu(){
    document.getElementById('vista-stock').classList.add('hidden');
    document.getElementById('menu-secciones').classList.remove('hidden');
}

function filtrar(){
    let f = document.getElementById('buscador').value.toUpperCase();
    let filas = document.getElementById('cuerpo-tabla').getElementsByTagName('tr');

    for (let i = 0; i < filas.length; i++) {
        filas[i].style.display = filas[i].innerText.toUpperCase().includes(f) ? "" : "none";
    }
}

</script>

</body>
</html>
