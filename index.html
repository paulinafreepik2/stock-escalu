<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STOCK IMMINENT - CONTROL TOTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* ESTA ES LA LÍNEA QUE FALTABA PARA QUE FUNCIONARA EL BOTÓN */
        .hidden { display: none !important; }
        
        .modo-cliente .solo-admin { display: none !important; }
        .btn-accion { width: 34px; height: 34px; border-radius: 8px; font-weight: bold; font-size: 18px; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-accion:active { transform: scale(0.9); opacity: 0.8; }
        .bg-card { background-color: #1a2230; }
        .bg-header { background-color: #111827; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans text-sm">
    <div class="max-w-[1400px] mx-auto p-4">
        
        <div id="pantalla-login" class="mt-20 max-w-md mx-auto bg-card p-8 rounded-3xl text-center border border-slate-700 shadow-2xl">
            <h1 class="text-4xl font-black mb-6 italic tracking-tighter text-white">IMMINENT</h1>
            <input id="input-pass" type="password" placeholder="CLAVE" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-center text-white text-xl font-bold mb-4 outline-none focus:border-blue-500">
            <button onclick="verificar()" class="w-full bg-blue-600 p-4 rounded-xl font-bold text-xl uppercase shadow-lg active:bg-blue-700 transition">Entrar</button>
        </div>

        <div id="menu-secciones" class="hidden text-center">
            <header class="mb-10">
                <h1 class="text-7xl font-black italic tracking-tighter text-white">IMMINENT</h1>
            </header>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 px-2">
                <button onclick="cargarStock('DAKOTA')" class="bg-orange-800 p-8 rounded-3xl font-bold text-xl shadow-lg hover:brightness-110">🌲 DAKOTA</button>
                <button onclick="cargarStock('DIURNO')" class="bg-sky-600 p-8 rounded-3xl font-bold text-xl shadow-lg hover:brightness-110">🌅 DIURNO</button>
                <button onclick="cargarStock('NOCTURNO')" class="bg-indigo-900 p-8 rounded-3xl font-bold text-xl shadow-lg hover:brightness-110">🌙 NOCTURNO</button>
                <button onclick="cargarStock('SOFAS')" class="bg-red-700 p-8 rounded-3xl font-bold text-xl shadow-lg hover:brightness-110">🛋️ SOFÁS</button>
                <button onclick="cargarStock('ELIAS')" class="bg-purple-700 p-8 rounded-3xl font-bold text-xl border-2 border-purple-400 shadow-lg hover:brightness-110">📦 ELIAS</button>
                <button onclick="verPedidos()" class="solo-admin bg-emerald-600 p-8 rounded-3xl font-bold text-xl border-2 border-emerald-400 shadow-lg hover:brightness-110">📝 PEDIDOS</button>
            </div>
        </div>

        <div id="vista-stock" class="hidden">
            <div class="flex justify-between items-center mb-6 px-2">
                <h2 id="titulo-linea" class="text-4xl font-black text-yellow-500 italic uppercase"></h2>
                <div class="flex gap-4 items-center">
                    <input id="buscador" onkeyup="filtrar()" placeholder="🔎 Buscar producto..." class="p-3 w-64 md:w-96 rounded-xl bg-card border border-slate-700 text-white outline-none focus:border-yellow-500">
                    <button onclick="volverAlMenu()" class="bg-slate-700 px-8 py-3 rounded-xl font-bold uppercase text-xs hover:bg-slate-600 transition">VOLVER</button>
                </div>
            </div>

            <div class="bg-card rounded-[2rem] border border-slate-800 overflow-hidden shadow-2xl">
                <table class="w-full text-left">
                    <thead class="bg-header text-slate-500 text-[10px] uppercase font-bold tracking-widest">
                        <tr>
                            <th class="p-5">REF</th>
                            <th class="p-5">DESC</th>
                            <th class="p-5 text-center uppercase">Recepcionadas (Pop)</th>
                            <th class="p-5 text-center uppercase">Vendido (+/-)</th>
                            <th class="p-5 text-center uppercase">Stock</th>
                            <th class="p-5 text-center col-pedido">PEDIR</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
        </div>

        <div id="vista-pedidos" class="hidden">
            <div class="bg-card p-6 rounded-[2rem] border border-slate-800 shadow-2xl">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-4xl font-black text-emerald-400 italic">📝 PEDIDOS</h2>
                    <div class="flex gap-3">
                        <button id="btn-historial" onclick="toggleHistorial()" class="bg-purple-600 px-6 py-3 rounded-xl font-bold text-xs uppercase">📜 HISTORIAL</button>
                        <button onclick="volverAlMenu()" class="bg-slate-700 px-6 py-3 rounded-xl font-bold text-xs">VOLVER</button>
                    </div>
                </div>
                <div class="overflow-x-auto"><table class="w-full text-left"><thead id="cabecera-pedidos" class="bg-header text-slate-500 text-xs uppercase"></thead><tbody id="cuerpo-pedidos" class="divide-y divide-slate-800"></tbody></table></div>
            </div>
        </div>
    </div>

    <script>
        const API = "https://stock-escalu-app.onrender.com";
        let seccionActual = ""; let esAdmin = false; let viendoHistorial = false; let pedidosCache = [];

        function verificar() {
            const pass = document.getElementById('input-pass').value.trim().toUpperCase();
            if (pass === '12345CUCA') { esAdmin = true; document.body.classList.remove('modo-cliente'); entrar("ADMINISTRADOR"); }
            else { esAdmin = false; document.body.classList.add('modo-cliente'); entrar("INVITADO"); }
        }

        function entrar(txt) {
            document.getElementById('txt-bienvenida').innerText = txt;
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }

        async function cargarStock(seccion) {
            seccionActual = seccion;
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-stock').classList.remove('hidden');
            document.getElementById('titulo-linea').innerText = seccion;
            
            const res = await fetch(`${API}/stock/${seccion}`);
            const datos = await res.json();
            const tabla = document.getElementById('cuerpo-tabla');
            tabla.innerHTML = '';
            
            datos.forEach(m => {
                const actual = m.recepcionadas - m.vendido;
                tabla.innerHTML += `
                <tr class="hover:bg-slate-800/30 transition border-slate-800">
                    <td class="p-5 text-blue-400 font-bold text-sm">${m.ref}</td>
                    <td class="p-5 text-slate-200 font-bold uppercase text-xs">${m.descripcion} (${m.color})</td>
                    <td class="p-5">
                        <div class="flex items-center justify-center gap-3">
                            <button onclick="accionPopUp('${m._id}', 'rec', -1)" class="solo-admin btn-accion bg-red-900 border border-red-700">-</button>
                            <span class="text-lg font-black w-8 text-center text-white">${m.recepcionadas}</span>
                            <button onclick="accionPopUp('${m._id}', 'rec', 1)" class="solo-admin btn-accion bg-emerald-700 border border-emerald-500">+</button>
                        </div>
                    </td>
                    <td class="p-5">
                        <div class="flex items-center justify-center gap-3">
                            <button onclick="accionDirecta('${m._id}', 'ven', -1)" class="solo-admin btn-accion bg-red-900 border border-red-700">-</button>
                            <span class="text-lg font-black w-8 text-center text-white">${m.vendido}</span>
                            <button onclick="accionDirecta('${m._id}', 'ven', 1)" class="solo-admin btn-accion bg-emerald-700 border border-emerald-500">+</button>
                        </div>
                    </td>
                    <td class="p-5 text-center text-2xl font-black text-white">${actual}</td>
                    <td class="p-5 text-center col-pedido">
                        <button onclick="anotarPedido('${m.ref}', '${m.descripcion}', '${m.color}')" class="bg-emerald-600 px-4 py-2 rounded-lg text-[9px] font-bold text-white shadow-md">🛒 PEDIR</button>
                    </td>
                </tr>`;
            });
        }

        async function accionPopUp(id, tipo, signo) {
            const msj = signo > 0 ? "¿CUÁNTAS UNIDADES RECEPCIONADAS?" : "¿CUÁNTAS UNIDADES QUITAR?";
            const num = prompt(msj);
            if (num != null && num != "" && !isNaN(num)) {
                const cantidad = parseInt(num) * signo;
                await fetch(`${API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${cantidad}`, { method: 'PUT' });
                cargarStock(seccionActual);
            }
        }

        async function accionDirecta(id, tipo, valor) {
            await fetch(`${API}/stock/actualizar/${id}?tipo=${tipo}&cantidad=${valor}`, { method: 'PUT' });
            cargarStock(seccionActual);
        }

        async function anotarPedido(ref, desc, color) {
            const cliente = prompt("¿CLIENTE?");
            if (!cliente) return;
            await fetch(`${API}/pedidos/crear`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ cliente: cliente.toUpperCase(), ref, descripcion: desc, color, cantidad: 1 })
            });
            alert("ANOTADO");
        }

        async function verPedidos() {
            viendoHistorial = false;
            document.getElementById('menu-secciones').classList.add('hidden');
            document.getElementById('vista-pedidos').classList.remove('hidden');
            document.getElementById('btn-historial').innerText = "📜 HISTORIAL";
            document.getElementById('cabecera-pedidos').innerHTML = `<tr><th class="p-5">CLIENTE</th><th class="p-5">MUEBLE</th><th class="p-5 text-center">LISTO</th></tr>`;
            const res = await fetch(`${API}/pedidos`);
            pedidosCache = await res.json();
            const tabla = document.getElementById('cuerpo-pedidos');
            tabla.innerHTML = '';
            pedidosCache.forEach(p => {
                tabla.innerHTML += `<tr class="border-slate-800"><td class="p-5 text-emerald-400 text-lg font-bold uppercase">${p.cliente}</td><td class="p-5 text-xs text-slate-400 font-bold uppercase">${p.descripcion} (${p.ref})</td><td class="p-5 text-center"><button onclick="terminar('${p._id}')" class="text-3xl">✅</button></td></tr>`;
            });
        }

        async function toggleHistorial() {
            viendoHistorial = !viendoHistorial;
            if (viendoHistorial) {
                document.getElementById('btn-historial').innerText = "📝 ACTIVOS";
                document.getElementById('cabecera-pedidos').innerHTML = `<tr><th class="p-5">CLIENTE</th><th class="p-5 text-center">EXCEL</th></tr>`;
                const res = await fetch(`${API}/pedidos/historial`);
                pedidosCache = await res.json();
                const tabla = document.getElementById('cuerpo-pedidos');
                tabla.innerHTML = '';
                const clientes = [...new Set(pedidosCache.map(p => p.cliente.toUpperCase()))];
                clientes.forEach(c => {
                    tabla.innerHTML += `<tr class="border-slate-800"><td class="p-5 text-emerald-400 text-lg font-bold uppercase">${c}</td><td class="p-5 text-center"><button onclick="descargarExcel('${c}')" class="bg-green-700 px-4 py-2 rounded-lg text-xs font-bold uppercase">📥 BAJAR</button></td></tr>`;
                });
            } else { verPedidos(); }
        }

        function descargarExcel(cliente) {
            const lista = pedidosCache.filter(p => p.cliente.toUpperCase() === cliente).map(p => ({ FECHA: p.fecha, REF: p.ref, DESC: p.descripcion, COLOR: p.color }));
            const ws = XLSX.utils.json_to_sheet(lista);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "PEDIDO");
            XLSX.writeFile(wb, `Albaran_${cliente}.xlsx`);
        }

        async function terminar(id) {
            if (confirm("¿ENTREGADO?")) { await fetch(`${API}/pedidos/finalizar/${id}`, { method: 'PUT' }); verPedidos(); }
        }

        function volverAlMenu() {
            document.getElementById('vista-stock').classList.add('hidden');
            document.getElementById('vista-pedidos').classList.add('hidden');
            document.getElementById('menu-secciones').classList.remove('hidden');
        }

        function filtrar() {
            let f = document.getElementById('buscador').value.toUpperCase();
            let filas = document.getElementById('cuerpo-tabla').getElementsByTagName('tr');
            for (let i = 0; i < filas.length; i++) { filas[i].style.display = filas[i].innerText.toUpperCase().includes(f) ? "" : "none"; }
        }
    </script>
</body>
</html>
